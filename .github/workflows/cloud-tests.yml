name: Cloud VLESS tests

on:
  pull_request:
    paths:
      - cloud_verified.py
      - tests/test_cloud_verified.py
      - .github/workflows/cloud-verified.yml
      - .github/workflows/cloud-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Test parser, dedup and empty-list protection
        run: python -m unittest discover -s tests -p "test_cloud_verified.py" -v
      - name: Compile Python
        run: python -m py_compile cloud_verified.py

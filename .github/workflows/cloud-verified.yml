name: Cloud verified VLESS subscription

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/cloud-verified.yml"
      - "cloud_verified.py"
  workflow_dispatch:
  schedule:
    # Stagger after the existing collector at 00/06/12/18 UTC.
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: gwz-cloud-subscription
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v5

      - name: Python unit tests
        run: python -m unittest discover -s tests -p "test_cloud_verified.py" -v

      - name: Download official sing-box 1.12.22
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/SagerNet/sing-box/releases/download/v1.12.22/sing-box-1.12.22-linux-amd64.tar.gz" \
            --output /tmp/sing-box.tar.gz
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          sudo install -m 0755 "/tmp/sing-box-1.12.22-linux-amd64/sing-box" /usr/local/bin/sing-box
          sing-box version

      - name: Probe real HTTPS via each VLESS tunnel
        run: |
          python cloud_verified.py \
            --source data/gwzhub_candidates.txt \
            --output cloud-vless.txt \
            --metadata data/cloud-status.json \
            --max-candidates 48 \
            --min-live 3 \
            --workers 6

      - name: Validate non-empty publication
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c '^vless://' cloud-vless.txt)" -ge 3
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("data/cloud-status.json").read_text())
          assert d["passed"] >= 0
          print("Cloud verified status:", d)
          PY

      - name: Commit cloud-only artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud-vless.txt data/cloud-status.json
          git diff --cached --quiet || git commit -m "Refresh verified cloud VLESS feed"
          # Another trusted workflow may update main while tunnel checks are running.
          # Never force-push; rebase and retry instead.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Concurrent update detected, rebasing (attempt $attempt)"
            git fetch origin main
            git rebase origin/main
          done
          echo "Failed to push cloud subscription after 3 retries" >&2
          exit 1

      - name: Mirror cloud subscription to Dropbox (optional)
        continue-on-error: true
        env:
          GWZ_DROPBOX_APP_KEY: ${{ secrets.GWZ_DROPBOX_APP_KEY }}
          GWZ_DROPBOX_APP_SECRET: ${{ secrets.GWZ_DROPBOX_APP_SECRET }}
          GWZ_DROPBOX_REFRESH_TOKEN: ${{ secrets.GWZ_DROPBOX_REFRESH_TOKEN }}
        run: python mirror_dropbox.py cloud-vless.txt

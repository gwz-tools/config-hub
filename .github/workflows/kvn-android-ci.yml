name: KVN Android CI

on:
  pull_request:
    paths:
      - 'android/kvn/**'
      - '.github/workflows/kvn-android-ci.yml'
  push:
    branches: [main]
    paths:
      - 'android/kvn/**'
      - '.github/workflows/kvn-android-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kvn-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android/kvn
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_TOOL="$(command -v sdkmanager || true)"
          if [ -z "$SDK_TOOL" ]; then SDK_TOOL="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          "$SDK_TOOL" 'platforms;android-35' 'build-tools;35.0.0'
       - name: Fetch verified official Xray AndroidLibXrayLite AAR
        run: python3 scripts/fetch_libv2ray.py
      - name: Validate bundled domain rules
        run: python3 scripts/check_assets.py
      - name: Compile Android, unit tests, Lint
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --console=plain :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Validate Kotlin-generated VPN config with upstream sing-box 1.14.4
        shell: bash
        run: |
          set -euo pipefail
          TARBALL="$RUNNER_TEMP/sing-box-1.14.4-linux-amd64.tar.gz"
          curl --fail --location --silent --show-error --connect-timeout 15 --max-time 120 \
            'https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-linux-amd64.tar.gz' \
            --output "$TARBALL"
          echo "699a1b510aa4396b2176d32d1181920399ebf1e267835da6f3b598d0f7c24968  $TARBALL" | sha256sum -c -
          tar -xzf "$TARBALL" -C "$RUNNER_TEMP"
          test -s app/build/ci-validation/vpn-auto.json
          "$RUNNER_TEMP/sing-box-1.14.4-linux-amd64/sing-box" check -c app/build/ci-validation/vpn-auto.json
          test -s app/build/ci-validation/vpn-direct.json
          "$RUNNER_TEMP/sing-box-1.14.4-linux-amd64/sing-box" check -c app/build/ci-validation/vpn-direct.json
      - name: Smoke-test real sing-box engine startup (DNS, routing and VLESS)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare_vpn_startup_smoke.py \
            app/build/ci-validation/vpn-auto.json \
            app/build/ci-validation/vpn-auto-smoke.json
          BIN="$RUNNER_TEMP/sing-box-1.14.4-linux-amd64/sing-box"
          "$BIN" check -c app/build/ci-validation/vpn-auto-smoke.json
          set +e
          timeout --signal=TERM --kill-after=2s 8s \
            "$BIN" run -c app/build/ci-validation/vpn-auto-smoke.json \
            > "$RUNNER_TEMP/kvn-sing-box-startup.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/kvn-sing-box-startup.log"
          if [ "$code" -ne 124 ]; then
            echo "::error::sing-box startup terminated prematurely with exit status $code"
            exit 1
          fi
          echo "sing-box startup survived 8s with real DNS and proxy outbounds."
      - name: Verify ARM64 and other ABI APKs, record SHA-256
        run: python3 scripts/check_apk_abis.py app/build/outputs/apk/debug
      - name: Self-test stable signing with disposable CI certificate
        shell: bash
        run: |
          set -euo pipefail
          # This key is never used for distributed APKs. It proves that the
          # configured apksigner command can re-sign an assembled debug APK.
          export KVN_SIGNING_PASSWORD='CI-only-disposable-password'
          TEMP_KEY="$RUNNER_TEMP/kvn-disposable-ci.p12"
          TEMP_APK="$RUNNER_TEMP/kvn-ci-re-signed.apk"
          trap 'rm -f "$TEMP_KEY" "$TEMP_APK"' EXIT
          keytool -genkeypair -noprompt -alias kvn \
            -keyalg RSA -keysize 2048 -validity 1 -storetype PKCS12 \
            -keystore "$TEMP_KEY" \
            -storepass "$KVN_SIGNING_PASSWORD" \
            -keypass "$KVN_SIGNING_PASSWORD" \
            -dname 'CN=Disposable CI Test'
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$SIGNER" sign \
            --ks "$TEMP_KEY" --ks-type PKCS12 --ks-key-alias kvn \
            --ks-pass env:KVN_SIGNING_PASSWORD \
            --key-pass env:KVN_SIGNING_PASSWORD \
            --out "$TEMP_APK" \
            app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          "$SIGNER" verify --verbose --print-certs "$TEMP_APK"
          echo "Re-signing previously debug-signed APK works with a PKCS12 key."

      # Optional stable signing. NEVER commit a keystore to this public repo.
      # Configure the two Actions secrets described in SIGNING.md. Without
      # them the verified CI debug APK is still emitted, but CAN'T update
      # APKs signed by another ephemeral runner (Android signature mismatch).
      - name: Sign upgrade-compatible Android APKs
        id: stable_signing
        shell: bash
        env:
          KVN_KEYSTORE_BASE64: ${{ secrets.KVN_SIGNING_KEYSTORE_BASE64 }}
          KVN_SIGNING_PASSWORD: ${{ secrets.KVN_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KVN_KEYSTORE_BASE64" && -z "$KVN_SIGNING_PASSWORD" ]]; then
            echo "::warning::Stable signing not configured; APKs are debug-signed and will require uninstall on the next CI run. See android/kvn/SIGNING.md"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$KVN_KEYSTORE_BASE64" || -z "$KVN_SIGNING_PASSWORD" ]]; then
            echo "::error::Both KVN_SIGNING_KEYSTORE_BASE64 and KVN_SIGNING_PASSWORD must be configured together."
            exit 1
          fi

          umask 077
          KEYSTORE_FILE="$(mktemp "$RUNNER_TEMP/kvn-signing-XXXXXXXX.p12")"
          trap 'rm -f "$KEYSTORE_FILE"' EXIT
          printf '%s' "$KVN_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"

          OUT="app/build/outputs/apk/stable"
          mkdir -p "$OUT"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$SIGNER"
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          if [[ "${#apks[@]}" -ne 1 ]]; then
            echo "::error::Expected 1 ARM64 APK for experimental Xray signing; found ${#apks[@]}."
            exit 1
          fi
          # apksigner signs the already-built/tested binaries. This step never
          # re-compiles, edits source or prints signing credentials.
          for apk in "${apks[@]}"; do
            name="$(basename "$apk" -debug.apk)-stable.apk"
            "$SIGNER" sign \
              --ks "$KEYSTORE_FILE" --ks-type PKCS12 --ks-key-alias kvn \
              --ks-pass env:KVN_SIGNING_PASSWORD \
              --key-pass env:KVN_SIGNING_PASSWORD \
              --out "$OUT/$name" "$apk"
            "$SIGNER" verify --verbose --print-certs "$OUT/$name"
            (cd "$OUT" && sha256sum "$name" > "$name.sha256")
          done
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "Stable-signed APKs ready. For an existing debug installation, one final reinstall is required."

      - name: Publish stable-signed upgrade-compatible APKs
        if: steps.stable_signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kvn-android-stable-${{ github.run_number }}
          path: |
            android/kvn/app/build/outputs/apk/stable/*.apk
            android/kvn/app/build/outputs/apk/stable/*.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Publish debug APKs (requires uninstall between CI runs)
        if: steps.stable_signing.outputs.enabled != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kvn-android-debug-${{ github.run_number }}
          path: |
            android/kvn/app/build/outputs/apk/debug/*.apk
            android/kvn/app/build/outputs/apk/debug/*.apk.sha256
            android/kvn/app/build/reports/lint-results-debug.html
          retention-days: 30
          if-no-files-found: error

name: KVN Android CI

on:
  pull_request:
    paths:
      - 'android/kvn/**'
  push:
    branches: [main]
    paths:
      - 'android/kvn/**'
      - '.github/workflows/kvn-android-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kvn-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android/kvn
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_TOOL="$(command -v sdkmanager || true)"
          if [ -z "$SDK_TOOL" ]; then SDK_TOOL="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          "$SDK_TOOL" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Fetch pinned libbox engine
        run: python3 scripts/fetch_libbox.py
      - name: Validate bundled domain rules
        run: python3 scripts/check_assets.py
      - name: Compile Android, unit tests, Lint
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --console=plain :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Record APK SHA-256
        run: |
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > app-debug.apk.sha256
      - name: Publish APK as downloadable test artifact
        uses: actions/upload-artifact@v4
        with:
          name: kvn-android-debug-${{ github.run_number }}
          path: |
            android/kvn/app/build/outputs/apk/debug/app-debug.apk
            android/kvn/app/build/outputs/apk/debug/app-debug.apk.sha256
            android/kvn/app/build/reports/lint-results-debug.html
          retention-days: 30
          if-no-files-found: error

      - name: Upload diagnostics after build failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kvn-android-diagnostics-${{ github.run_number }}
          path: |
            android/kvn/app/build/reports/lint-results-debug.html
            android/kvn/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
            android/kvn/app/build/test-results/testDebugUnitTest/
          retention-days: 7
          if-no-files-found: ignore

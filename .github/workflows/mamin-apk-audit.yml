name: Mamin APK public key forensic audit

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/mamin-apk-audit.yml"
      - "mamin_apk_audit.py"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Download user-provided APK for read-only examination
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 \
            --connect-timeout 15 --max-time 180 \
            "https://www.tvbox.one/atv-release/Mamin-VPN-0.9.29.apk" \
            --output "$RUNNER_TEMP/mamin.apk"
          test "$(stat -c %s "$RUNNER_TEMP/mamin.apk")" -gt 1024
          file "$RUNNER_TEMP/mamin.apk"
          python3 - <<'PY'
          import os, zipfile
          assert zipfile.is_zipfile(os.environ["RUNNER_TEMP"] + "/mamin.apk"), "Not an APK/ZIP"
          print("APK archive structurally recognized")
          PY

      - name: Find pinned and extracted public keys and verify real catalogue
        shell: bash
        run: |
          set -euo pipefail
          python3 mamin_apk_audit.py --apk "$RUNNER_TEMP/mamin.apk" | tee "$RUNNER_TEMP/mamin-apk-audit-status.txt"

      - name: Commit public-only audit fingerprints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          cp "$RUNNER_TEMP/mamin-apk-audit-status.txt" data/mamin-apk-audit-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mamin-apk-audit-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record non-sensitive Mamin APK key audit"
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              git fetch origin main
              git rebase origin/main
              if [ "$attempt" -eq 3 ]; then
                echo "Failed to publish audit fingerprints" >&2
                exit 1
              fi
            done
          fi

      - name: Remove APK without executing it
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/mamin.apk"

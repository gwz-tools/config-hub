name: Mamin VPN signed catalogue audit

on:
  push:
    branches: ["main"]
    paths:
      - "mamin_verify_import.py"
      - "tests/test_mamin_verify_import.py"
      - "mamin_probe.py"
      - "mamin_signing_key.py"
      - ".github/workflows/mamin-audit.yml"
  workflow_dispatch:
  schedule:
    - cron: "39 4 * * 1"

permissions:
  contents: write

concurrency:
  group: gwz-mamin-audit
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v5

      - name: Offline tests for signature, invalid URLs and rollback
        run: python3 -m unittest discover -s tests -p "test_mamin_verify_import.py" -v

      - name: Download exact SHA256-pinned Mamin APK for bootstrap public key
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[run-mamin-audit]')
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 \
            --connect-timeout 15 --max-time 180 \
            "https://www.tvbox.one/atv-release/Mamin-VPN-0.9.29.apk" \
            --output "$RUNNER_TEMP/mamin.apk"
          echo "70df40e973a4e0af4dbd2465bb398455794117da7be6c075b3afe78d698313fb  $RUNNER_TEMP/mamin.apk" | sha256sum -c -

      - name: Verify fresh upstream RS256 catalogue
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[run-mamin-audit]')
        shell: bash
        run: |
          set -euo pipefail
          python3 mamin_verify_import.py --output-dir "$RUNNER_TEMP/mamin" --diagnose --apk-file "$RUNNER_TEMP/mamin.apk"
          touch "$RUNNER_TEMP/mamin-signature-ok"

      - name: Check accepted VLESS against existing cloud parser
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[run-mamin-audit]')
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          from cloud_verified import unique_candidates
          source = Path(os.environ["RUNNER_TEMP"]) / "mamin" / "mamin-vless-reality.verified.txt"
          accepted = unique_candidates(source, 10000)
          print("Parser-compatible VLESS candidates:", len(accepted))
          if not accepted:
              raise SystemExit("No candidate is compatible with cloud checker; publication blocked")
          print("Signature checked; no endpoint was published or sent to Podkop")
          PY

      - name: Install sing-box for real tunnel checks
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[run-mamin-audit]')
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/SagerNet/sing-box/releases/download/v1.12.22/sing-box-1.12.22-linux-amd64.tar.gz" \
            --output "$RUNNER_TEMP/sing-box.tar.gz"
          tar -xzf "$RUNNER_TEMP/sing-box.tar.gz" -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/sing-box-1.12.22-linux-amd64/sing-box" /usr/local/bin/sing-box

      - name: Probe real HTTPS through verified Mamin candidates
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[run-mamin-audit]')
        shell: bash
        run: |
          set -euo pipefail
          python3 mamin_probe.py \
            --source "$RUNNER_TEMP/mamin/mamin-vless-reality.verified.txt" \
            --max-candidates 20 --workers 4 \
            > "$RUNNER_TEMP/mamin-report.json"
          cat "$RUNNER_TEMP/mamin-report.json"
          {
            echo "## Mamin signed catalogue audit"
            echo ""
            echo "Only counts are shown; no endpoints or credentials are published."
            echo ""
            echo '~~~json'
            cat "$RUNNER_TEMP/mamin-report.json"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish non-sensitive audit counters only
        if: always() && (github.event_name != 'push' || contains(github.event.head_commit.message, '[run-mamin-audit]'))
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          import json
          import os
          from pathlib import Path
          temp = Path(os.environ["RUNNER_TEMP"])
          source = temp / "mamin-report.json"
          status = {
              "checked_at_utc": datetime.now(timezone.utc).isoformat(),
              "rsa_signature_verified": (temp / "mamin-signature-ok").exists(),
              "candidates_tested": 0,
              "end_to_end_passed": 0,
              "status": "uncompleted",
              "published": False,
              "note": "Cloud-side check only; never proof of reachability on Tele2/T2",
          }
          if source.exists():
              report = json.loads(source.read_text())
              status["status"] = "completed"
              status["candidates_tested"] = int(report.get("candidate_count", 0))
              status["end_to_end_passed"] = int(report.get("end_to_end_passed", 0))
          out = Path("data/mamin-audit-status.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(status, indent=2, ensure_ascii=False) + "\n")
          print("Safe audit counters:", status)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mamin-audit-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update safe Mamin audit counters"
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              git fetch origin main
              git rebase origin/main
            done
            echo "Unable to save audit counters after 3 attempts" >&2
            exit 1
          fi

      - name: Remove ephemeral catalogue files
        if: always()
        shell: bash
        run: |
          rm -f -- "$RUNNER_TEMP/mamin.apk"
          if [ -d "$RUNNER_TEMP/mamin" ]; then
            rm -rf -- "$RUNNER_TEMP/mamin"
          fi

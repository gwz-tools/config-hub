name: Mamin to Happ unlisted subscription (GitHub Pages)

on:
  workflow_dispatch:
  schedule:
    # Independent of GWZHUB. All times UTC, every six hours.
    - cron: "41 0,6,12,18 * * *"

permissions:
  contents: read

concurrency:
  group: mamin-pages-unlisted-subscription
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Checkout safe, source-only repository
        uses: actions/checkout@v5

      - name: Validate private path is provided via GitHub Actions secret
        shell: bash
        env:
          MAMIN_PAGES_PATH: ${{ secrets.MAMIN_PAGES_PATH }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys
          value = os.getenv("MAMIN_PAGES_PATH", "")
          if not re.fullmatch(r"[a-f0-9]{48,64}", value):
              sys.exit("Set Actions repository secret MAMIN_PAGES_PATH (48-64 lowercase hex characters)")
          print("Unlisted subscription path configured (value hidden).")
          PY

      - name: Offline publisher tests
        run: python3 -m unittest discover -s tests -p "test_mamin_pages_build.py" -v

      - name: Download exact audited APK, verify SHA256
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 \
            --connect-timeout 15 --max-time 180 \
            https://www.tvbox.one/atv-release/Mamin-VPN-0.9.29.apk \
            --output "$RUNNER_TEMP/mamin.apk"
          printf '%s  %s\n' \
            '70df40e973a4e0af4dbd2465bb398455794117da7be6c075b3afe78d698313fb' \
            "$RUNNER_TEMP/mamin.apk" | sha256sum -c -

      - name: Install independent Sing-box 1.12.22 for cloud probe
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/SagerNet/sing-box/releases/download/v1.12.22/sing-box-1.12.22-linux-amd64.tar.gz \
            --output "$RUNNER_TEMP/sing-box.tar.gz"
          tar -xzf "$RUNNER_TEMP/sing-box.tar.gz" -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/sing-box-1.12.22-linux-amd64/sing-box" /usr/local/bin/sing-box
          sing-box version

      - name: Validate fresh signed catalogue and create temporary Pages site
        shell: bash
        env:
          MAMIN_PAGES_PATH: ${{ secrets.MAMIN_PAGES_PATH }}
        run: |
          set -euo pipefail
          python3 mamin_pages_build.py \
            --apk-file "$RUNNER_TEMP/mamin.apk" \
            --output-dir "$RUNNER_TEMP/mamin-happ-pages" \
            --sing-box /usr/local/bin/sing-box \
            --max-candidates 20 \
            --min-live 3 \
            --max-live 20 \
            --workers 4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload temporary Pages artifact (not a Git commit)
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/mamin-happ-pages
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy only if at least three live nodes were found
        id: deployment
        uses: actions/deploy-pages@v4

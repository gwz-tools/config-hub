name: Mamin GWZHUB private-source tests

on:
  push:
    branches: ["main"]
    paths:
      - "mamin_hub_update.py"
      - "mamin_hub_diagnose.py"
      - "mamin_control_ab.py"
      - "mamin_verify_import.py"
      - "mamin_signing_key.py"
      - "install_mamin_hub.sh"
      - "enable_mamin_cron.sh"
      - "tests/test_mamin_hub_update.py"
      - "tests/test_mamin_hub_diagnose.py"
      - "mamin_hub_diagnose.py"
      - ".github/workflows/mamin-hub-tests.yml"
  pull_request:
    paths:
      - "mamin_hub_update.py"
      - "tests/test_mamin_hub_update.py"
      - ".github/workflows/mamin-hub-tests.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - name: Run private source fail-closed tests
        run: python3 -m unittest discover -s tests -p 'test_mamin_hub_update.py' -v
      - name: Run credential-safe diagnostic tests
        run: python3 -m unittest discover -s tests -p 'test_mamin_hub_diagnose.py' -v
      - name: Check Python syntax
        run: python3 -m py_compile mamin_hub_update.py mamin_verify_import.py mamin_signing_key.py mamin_probe.py mamin_hub_diagnose.py mamin_control_ab.py
      - name: Check installer and scheduler shell syntax
        run: sh -n install_mamin_hub.sh enable_mamin_cron.sh

      - name: Record safe offline test status
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          status = {
              "checked_at_utc": datetime.now(timezone.utc).isoformat(),
              "commit": os.getenv("GITHUB_SHA", ""),
              "offline_tests_passed": True,
              "python_syntax_ok": True,
              "live_hub_deployment": False,
              "no_public_vpn_credential_output": True
          }
          path = Path("data/mamin-hub-tests-status.json")
          path.parent.mkdir(exist_ok=True)
          path.write_text(json.dumps(status, indent=2) + "\n")
          print("Offline test result:", status)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mamin-hub-tests-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Mamin Hub offline CI status"
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              git fetch origin main
              git rebase origin/main
            done
            echo "Unable to publish offline CI status" >&2
            exit 1
          fi

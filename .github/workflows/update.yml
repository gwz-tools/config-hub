name: Daily update

on:

  workflow_dispatch:

  schedule:
    - cron: "0 3 * * *"


permissions:

  contents: write



jobs:

  update:

    runs-on: ubuntu-latest


    steps:


      - name: Checkout
        uses: actions/checkout@v4



      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.x"



      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip
          pip install requests



      - name: Run collector
        run: |

          python collector.py



      - name: Validate data
        run: |

          python validator.py



      - name: Save last good snapshot
        run: |

          python last_good.py



      - name: Generate statistics
        run: |

          python stats.py



      - name: Update history
        run: |

          python history_manager.py



      - name: Save results
        run: |

          git config user.name "actions-user"
          git config user.email "actions@github.com"


          git add data history logs


          git diff --cached --quiet || (

            git commit -m "Update data snapshot"

            git push

          )

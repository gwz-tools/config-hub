name: Daily update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"


permissions:
  contents: write


jobs:

  update:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip


      - name: Run collector
        run: |
          python collector.py


      - name: Validate data
        run: |
          python validator.py


      - name: Update history
        run: |
          python history_manager.py


      - name: Calculate quality score
        run: |
          python quality_score.py


      - name: Build TOP pool
        run: |
          python top_pool.py


      - name: Publish fast list
        run: |
          python publisher.py


      - name: Check generated files
        run: |
          echo "Repository files:"
          ls -la
          echo ""
          echo "Data directory:"
          ls -la data || true


      - name: Commit updated data
        run: |

          git config --global user.name "gwz-tools"
          git config --global user.email "actions@github.com"


          git add \
            data \
            history \
            logs \
            fast.txt


          git diff --cached --quiet || git commit -m "Update GWZ data"


      - name: Push changes
        run: |
          git push

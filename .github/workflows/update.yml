name: Daily update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: gwz-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run collector
        run: python collector.py

      - name: Build geo-balanced GWZHUB candidate feed
        run: python gwzhub_candidates.py

      - name: Validate candidate feed
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import unquote
          p = Path("data/gwzhub_candidates.txt")
          rows = [x for x in p.read_text(encoding="utf-8").splitlines() if x.strip()]
          assert len(rows) >= 80, f"candidate pool too small: {len(rows)}"
          text = "\n".join(unquote(x) for x in rows)
          for country in ("Netherlands", "Lithuania"):
              if country not in text:
                  print(f"WARNING: {country} absent from this upstream snapshot")
          print(f"Candidate pool OK: {len(rows)}")
          PY

      - name: Validate collected data
        run: python validator.py

      - name: Update history
        run: python history_manager.py

      - name: Calculate source quality
        run: python quality_score.py

      - name: Build TOP pool
        run: python top_pool.py

      - name: Publish fast list
        run: python publisher.py

      - name: Generate statistics
        run: python stats.py

      - name: Show GWZHUB candidate diagnostics
        run: |
          cat data/gwzhub_candidates.meta
          echo "candidate_lines=$(grep -c '^vless://' data/gwzhub_candidates.txt || true)"
          echo "validated_lines=$(grep -c '^vless://' data/validated.txt || true)"

      - name: Commit updated data
        run: |
          git config user.name "gwz-tools"
          git config user.email "actions@github.com"
          git add data history fast.txt
          git diff --cached --quiet || git commit -m "Update GWZ data"

      - name: Push changes
        run: git push

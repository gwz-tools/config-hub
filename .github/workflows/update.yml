name: Daily update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"


jobs:

  update:

    runs-on: ubuntu-latest


    permissions:
      contents: write


    steps:


      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip


      - name: Run collector
        run: |
          python collector.py


      - name: Validate data
        run: |
          python validator.py


      - name: Check fallback
        run: |
          python fallback.py


      - name: Generate statistics
        run: |
          python stats.py


      - name: Save history
        run: |
          python history_manager.py


      - name: Build TOP pool
        run: |
          python top_pool.py


      - name: Save results
        run: |

          git config user.name "config-hub-bot"

          git config user.email "actions@github.com"

          git add .

          git commit -m "Update data snapshot" || exit 0

          git push

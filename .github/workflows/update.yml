name: Daily update


on:

  schedule:

    # Daily run at 03:00 UTC
    - cron: "0 3 * * *"


  workflow_dispatch:



permissions:

  contents: write



jobs:

  update:


    runs-on: ubuntu-latest


    steps:


      - name: Checkout

        uses: actions/checkout@v4



      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.x"



      - name: Install dependencies

        run: |

          pip install requests



      - name: Run collector

        run: |

          python collector.py



      - name: Validate data

        run: |

          python validator.py



      - name: Protect history

        run: |

          python history_manager.py



      - name: Generate statistics

        run: |

          python stats.py



      - name: Save results

        run: |

          git config user.name "config-hub-bot"

          git config user.email "actions@github.com"


          git add data history


          git diff --cached --quiet || (

            git commit -m "Update data snapshot"

            git push

          )
